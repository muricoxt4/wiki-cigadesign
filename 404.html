<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/imagens/favicon.png">
    <title>Página não encontrada | CIGA design Brasil</title>
    <meta name="robots" content="noindex">
    <style>
        @font-face {
            font-family: 'CIGA Helvetica';
            src: url('/manualMarca/fonts/HelveticaNeueLTPro-Lt.otf') format('opentype');
            font-weight: 300;
            font-display: swap;
        }
        @font-face {
            font-family: 'CIGA Helvetica';
            src: url('/manualMarca/fonts/HelveticaNeueLTPro-Bd.otf') format('opentype');
            font-weight: 700;
            font-display: swap;
        }

        :root {
            --bg:         #050505;
            --accent:     #2E7BC4;
            --gold:       #C9A962;
            --text:       #ffffff;
            --text-muted: #a0a0a0;
            --border:     rgba(255,255,255,0.10);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 2rem;
            text-align: center;
            background: var(--bg);
            color: var(--text);
            font-family: 'CIGA Helvetica', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 300;
        }

        .logo { width: 130px; opacity: .9; margin-bottom: 1rem; }

        .code {
            font-size: clamp(4rem, 18vw, 8rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -.04em;
            color: var(--accent);
        }

        h1 {
            font-size: clamp(1.1rem, 4vw, 1.6rem);
            font-weight: 700;
            letter-spacing: .02em;
        }

        p {
            max-width: 34rem;
            color: var(--text-muted);
            font-size: .95rem;
            line-height: 1.7;
        }

        .actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; margin-top: .5rem; }

        a.btn {
            display: inline-block;
            padding: .85rem 1.9rem;
            border: 1px solid var(--border);
            border-radius: 2px;
            color: var(--text);
            text-decoration: none;
            font-size: .8rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            transition: border-color .25s ease, color .25s ease, background .25s ease;
        }

        a.btn:hover { border-color: var(--accent); color: var(--accent); }
        a.btn.gold:hover { border-color: var(--gold); color: var(--gold); }

        footer {
            margin-top: 2.5rem;
            font-size: .7rem;
            letter-spacing: .1em;
            color: #555;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <img src="/imagens/ciga-logo.png" alt="CIGA design" class="logo">

    <div class="code">404</div>
    <h1>Esta página não existe</h1>
    <p>O endereço acessado não faz parte do presskit da CIGA design Brasil, ou o material foi movido. Volte ao índice para acessar todos os modelos da coleção.</p>

    <div class="actions">
        <a class="btn" href="/">Voltar ao presskit</a>
        <a class="btn gold" href="https://www.usecigadesign.com.br/" target="_blank" rel="noopener">Site oficial</a>
    </div>

    <footer>CIGA design Brasil · Presskit</footer>
</body>
</html>
